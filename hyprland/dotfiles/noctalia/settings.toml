[osd.kinds]
media = false

[plugin_settings."noctalia/wallhaven"]
api_key = "wUx79v7UcClMt5wmqwAyZUkJwRElzWsg"
browser_open_near_click = true
browser_placement = "floating"

[plugins]
enabled = [ "noctalia/kaomoji", "noctalia/wallhaven", "noctalia/timer" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
external_ip_enabled = true
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"

    [shell.screen_corners]
    enabled = true
    size = 20

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl reboot --firmware"
    countdown_seconds = 0.0
    enabled = true
    glyph = "wash-dry-dip"
    label = "Reboot to UEFI"
    shortcut = "6"
    variant = "default"

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Tokyo-Night"
community_palette = "Occult Umbral"
custom_palette = "Carmine"
mode = "auto"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
