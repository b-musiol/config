config_version = 13

[bar]
order = [ "default", "bar" ]

    [bar.bar]
    border_width = 2.0
    center = [ "audio_visualizer", "spacer", "clock", "spacer", "date" ]
    enabled = true
    end = [ "tray", "volume", "cpu-temp", "gpu-temp" ]
    font_weight = 700
    icon_color = "secondary"
    margin_edge = 10
    margin_ends = 20
    panel_overlap = 2
    radius = 16
    start = [ "launcher", "workspaces" ]
    thickness = 40
    widget_spacing = 10

        [bar.bar.monitor.DP-1]
        enabled = false

    [bar.default]
    border_width = 2.0
    center = [ "active_window", "spacer", "clock", "spacer", "date", "spacer", "audio_visualizer" ]
    end = [
        "group:g4",
        "group:g2",
        "group:g3",
        "weather",
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "bar",
        "control-center",
        "session"
    ]
    icon_color = "secondary"
    margin_edge = 10
    margin_ends = 20
    panel_overlap = 2
    radius = 16
    scale = 1.1000000089406967
    start = [ "launcher", "group:g1", "workspaces" ]
    thickness = 40
    widget_spacing = 10

        [bar.default.monitor.DP-3]
        enabled = false

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "wallpaper", "wallhaven" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "cpu-usage", "gpu-usage", "gpu-vram", "ram_usage" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "cpu-temp", "gpu-temp" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "network_tx", "network_rx" ]
        opacity = 1.0
        padding = 6.0

