[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[window]
dynamic_padding = true
decorations = "full"
title = "Alacritty@CachyOS"
opacity = 0.99
decorations_theme_variant = "Dark"

[window.dimensions]
columns = 100
lines = 30

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "0x09090a"
foreground = "0xD8DEE9"

[colors.normal]
black   = "0x3B4252"
red     = "0x960018"
green   = "0x268A73"
yellow  = "0xC89A2B"
blue    = "0x4D7FB8"
magenta = "0x8E5A97"
cyan    = "0x3E98A9"
white   = "0xD9DEE8"

[colors.bright]
black   = "0x4C566A"
red     = "0xB31A33"
green   = "0x34A089"
yellow  = "0xE1B645"
blue    = "0x6799D2"
magenta = "0xA875B2"
cyan    = "0x58B6C5"
white   = "0xECEFF4"

[font]
size = 12

[font.normal]
family = "NotoSans monospace"
style = "Regular"

[font.bold]
family = "NotoSans monospace"
style = "Bold"

[font.italic]
family = "NotoSans monospace"
style = "Italic"

[font.bold_italic]
family = "NotoSans monospace"
style = "Bold Italic"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = "Underline"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "PageUp"
mods = "Control|Shift"
mode = "~Alt"
action = "ScrollHalfPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Control|Shift"
mode = "~Alt"
action = "ScrollHalfPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
live_config_reload = true
working_directory = "None"
